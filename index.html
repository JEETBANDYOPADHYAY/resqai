<!doctype html>
<html lang="en">
  <head>
    <script>
      // Suppress benign [vite] websocket connection warnings and events in sandboxed preview
      (function () {
        var isViteMsg = function (msg) {
          if (!msg) return false;
          var str = typeof msg === 'string' ? msg : (msg.message || msg.reason || String(msg));
          return str.indexOf('[vite]') !== -1 || str.indexOf('failed to connect to websocket') !== -1 || str.indexOf('vite-hmr') !== -1;
        };
        var filterLog = function (orig) {
          return function () {
            for (var i = 0; i < arguments.length; i++) {
              if (isViteMsg(arguments[i])) return;
            }
            orig.apply(console, arguments);
          };
        };
        console.error = filterLog(console.error);
        console.warn = filterLog(console.warn);
        console.info = filterLog(console.info);
        window.addEventListener('error', function (e) {
          if (isViteMsg(e.message) || isViteMsg(e.error)) {
            e.preventDefault();
            e.stopPropagation();
          }
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          if (isViteMsg(e.reason)) {
            e.preventDefault();
            e.stopPropagation();
          }
        }, true);
      })();
    </script>
