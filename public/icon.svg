<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#EF4444" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#374151" stroke-width="4" stroke-opacity="0.5"/>

  <!-- Protective Shield -->
  <path d="M 256 96 L 384 152 C 384 272 256 368 256 392 C 256 368 128 272 128 152 Z" fill="url(#shieldGrad)" filter="url(#glow)"/>

  <!-- Inner Lifebuoy / Radar Pulse -->
  <circle cx="256" cy="232" r="54" fill="none" stroke="#FFFFFF" stroke-width="16"/>
  <circle cx="256" cy="232" r="26" fill="#FFFFFF"/>

  <!-- Emergency Wave Signal -->
  <path d="M 196 232 L 224 232 L 238 200 L 256 264 L 274 212 L 288 232 L 316 232" fill="none" stroke="#111827" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Offline / Autonomous Ready Indicator Dot -->
  <circle cx="256" cy="340" r="10" fill="#22D3EE"/>
</svg>
